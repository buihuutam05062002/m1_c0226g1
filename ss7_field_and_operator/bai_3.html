<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<label for="number_1"></label>
<input type="number" id="number_1">
<label for="number_2"></label>
<input type="number" id="number_2">

<div>
    <button type="button" onclick="addition()">Addition(+)</button>
    <button type="button" onclick="subtraction()">Subtraction(-)</button>
    <button type="button" onclick="multiplication()">Multiplication(X)</button>
    <button type="button" onclick="division()">division(/)</button>
</div>
<div>
    <h3 id="result"></h3>
</div>
</body>
<script>
    let result_dom  = document.getElementById("result");

    function getNumber(id){
        return parseFloat(document.getElementById(id).value);
    }



    function addition(){
        let result;
        let number1 = getNumber(number1);
        let number2 = getNumber(number2);
        result = number1 + number2;
        result_dom.innerHTML = result;
    }
    function subtraction(){
        let result;
        let number1 = getNumber(number1);
        let number2 = getNumber(number2);
        result = number1 - number2;
        result_dom.innerHTML = result;
    }
    function multiplication(){
        let result;
        let number1 = getNumber(number1);
        let number2 = getNumber(number2);
        result = number1 * number2;
        result_dom.innerHTML = result;

    }
    function division(){
        let result;
        let number1 = getNumber(number1);
        let number2 = getNumber(number2);
        result = number1 / number2;
        result_dom.innerHTML = result;
    }
</script>
</html>
