<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>

<label for="circleRadius">Nhập bán kính</label><br>
<input type="number" name="radius" id="circleRadius"><br>

<h1 id="perimeterResult"></h1>

<button onclick="calculatePerimeter()">Calculate</button>

</body>
<script type="text/javascript">
  function calculatePerimeter() {
    let circleRadius = parseFloat(document.getElementById('circleRadius').value);

    let perimeterResult = document.getElementById('perimeterResult');

    perimeterResult.innerText= circleRadius * 2 * Math.PI ;
  }
</script>
</html>
