<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<label for="celsius"></label><br>
<input type="number" name="celsius" id="celsius"><br>

<h1 id="fahrenheit"></h1>

<button onclick="celsiusToFahrenheit()">Calculate</button>

</body>
<script>
  function celsiusToFahrenheit(){
    let celsius = parseFloat(document.getElementById('celsius').value);

    let fahrenheit = (celsius*1.8) +32 ;

    printFahrenheit = document.getElementById('fahrenheit')
    printFahrenheit.innerText = fahrenheit;
  }

</script>
</html>
