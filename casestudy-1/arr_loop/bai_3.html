<script>

    function maxFraction(arrA, arrB) {
        let n = arrA.length;
        let maxNum = arrA[0]/arrB[0];
        let index;
        for (let i = 0; i < n; i++) {
            if((arrA[i] / arrB[i]) > maxNum) {
                maxNum =(arrA[i] / arrB[i]);
                index = i;
            }
        }
        return index;
    }

    console.log(maxFraction([5,2,5],[6,3,4]));


</script>
</body>
