<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>


<script>
    let h = 5;

    let mid = 10 / 2
    let left = Math.floor(mid);
    let right = mid;


    for (let i = 0; i < h; i++) {
        for (let j = 0; j < 10; j++) {
            if (j < left || j > right) {
                document.writeln("1")
            } else {
                if ((i === 0 || j === left || j === right || i === (h - 1))) {
                    document.writeln("*");
                } else {
                    document.writeln("1");
                }
            }
        }
        left--;
        right++;
        document.writeln("<br>");
    }
</script>
</body>
</html>
