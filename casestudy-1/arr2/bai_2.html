<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>


<script>
    function prime(numb){
        if(numb === 1){
            return false;
        }
        for(let i=2; i<numb; i++){
            if(numb%i === 0){
                return false;
            }
        }
        return true
    }

    let row = +prompt("nhập số dòng ");
    let column = +prompt("nhập số cột");


    let arr = [];
    let sum = 0;

    let count = 0;
    for (let i = 0; i < row; i++) {
        arr[i] =[]
        for (let j = 0; j < column; j++) {
            arr[i][j] = +prompt(`nhập số tại vị trí ${i} và ${j}  `);

            if (prime(arr[i][j])){
                count++;
            }
        }
    }
    console.log(count);
</script>
</body>
</html>
