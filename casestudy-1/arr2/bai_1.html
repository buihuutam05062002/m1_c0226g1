<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>


<script>

    let row = +prompt("nhập số dòng ");
    let column = +prompt("nhập số cột");


    let arr = [];
    let sum = 0;
    for (let i = 0; i < row; i++) {
        arr[i] =[]
        for (let j = 0; j < column; j++) {
            arr[i][j] = +prompt(`nhập số tại vị trí ${i} và ${j}  `);

            if (arr[i][j] % 2 === 0){
                sum += arr[i][j];
            }
        }
    }
    console.log(sum);
</script>
</body>
</html>
