<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<style>
    td, th {
        border: 1px solid black;

    }

    table {
        width: 400px;
    }
</style>
<body>

<h2>Add new product</h2>
<form>
    <input type="text" name="" id="inputProduct">
    <button type="button" id="btnAddProduct">Add</button>
</form>
<br>
<h2>Display All Product</h2>
<table id="tableProduct"></table>


<script>
    class Products {
        product;

        constructor() {
            this.product = [];
        }
        getProducts() {
            return this.product;
        }


        displayProduct() {
            for (let i = 0; i < this.product.length; i++) {
                console.log(this.product[i]);
            }
        }

        addProduct(product) {
            this.product.push(product);
        }

        deleteProduct(id) {
            this.product.splice(id, 1);
        }

        editProduct(id, value) {
            this.product[id].setName(value);
        }
    }

    class Product {
        #name

        constructor(name) {
            this.#name = name;
        }

        setName(name) {
            this.#name = name;
        }

        getName() {
            return this.#name;
        }
    }

    let tableProduct = document.getElementById("tableProduct");
    let inputProduct = document.getElementById("inputProduct");
    let products = new Products();
    let btnAddProduct = document.getElementById("btnAddProduct");


    function displayProduct() {
        tableProduct.innerHTML = '';
        for (let i = 0; i < products.getProducts().length; i++) {
            let trElement = document.createElement("tr");

            let tdElementCount = document.createElement("td");
            tdElementCount.innerText = `${i + 1}`;

            let tdElementName = document.createElement("td");
            tdElementName.innerText = `${products.getProducts()[i].getName()}`;

            let tdBtnEdit = document.createElement("td")
            tdBtnEdit.innerHTML = `<button type="button" onclick="editProduct(${i})">Edit</button>`

            let tdBtnDelete = document.createElement("td")
            tdBtnDelete.innerHTML = `<button type="button" onclick="deleteProduct(${i})">Delete</button>`

            trElement.appendChild(tdElementCount);
            trElement.appendChild(tdElementName);
            trElement.appendChild(tdBtnEdit);
            trElement.appendChild(tdBtnDelete);

            tableProduct.appendChild(trElement);
        }
    }

    function addProduct(product) {
        console.log(product);
        products.addProduct(product);
        displayProduct();
    }

    btnAddProduct.addEventListener("click", () =>{
        if(inputProduct.value === ""){
            return;
        }
        else{
        addProduct(new Product(inputProduct.value))
        }
    } );


    function deleteProduct(productIndex) {
        let isDelete = confirm("Are you sure you want to delete this product?");
        if (isDelete) {
            products.deleteProduct(productIndex);
            displayProduct();
        }
    }

    function editProduct(productIndex) {
        let editInput = prompt("Enter Product Name");
        products.editProduct(productIndex, editInput);
        displayProduct();
    }


</script>
</body>
</html>
