</head>

<script>
    for (let i = 0; i < 5; i++) {
        for (let j = 0; j <= 20; j++) {
            if (i === 0 || j === 0 || j === 19 || i === 4) {
                document.writeln("*");
            } else {
                document.writeln("&nbsp&nbsp");
            }
        }
        document.writeln("<br>");
    }
</script>
