<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>


<script>
    function fibonacci(n) {
        if (n <= 2) return 1;

        let prev = 1;
        let curr = 1;

        for (let i = 3; i <= n; i++) {
            const next = prev + curr;
            prev = curr;
            curr = next;
        }

        return curr;
    }

    for(let i = 0; i <= 20; i++) {
        console.log(fibonacci(i));
    }


</script>
</body>
</html>
