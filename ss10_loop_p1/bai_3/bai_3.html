<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<script>
    let check = 4;
    for (let i = 0; i < 5; i++) {
        for (let j = 0; j < 5; j++) {
            if(check > j){
                document.writeln("-");

            }
            else{
                document.writeln("*");
            }
        }
        check--;
        document.writeln("<br>");
    }
</script>
</body>
</html>
