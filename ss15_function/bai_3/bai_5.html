<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<button id="btnEvent">Click me</button>
<script>
    let stars  = ["Polaris", "Aldebaran", "Deneb", "Vega", "Altair", "Dubhe", "Regulus"];
    let constellations  = ["Ursa Minor", "Taurus", "Cygnus", "Lyra", "Aquila", "Ursa Major", "Leo"];

    function findConstellation(starName) {
        for (let i = 0; i < stars .length; i++) {
            if (starName === stars [i]) {
                return constellations [i];
            }
        }
        return "Không tìm thấy";
    }

    let btnEvent = document.getElementById("btnEvent");
    btnEvent.addEventListener("click", () => console.log(findConstellation(prompt("Nhập chuỗi muốn check"))));
</script>

</body>
</html>
