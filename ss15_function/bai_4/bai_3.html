<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<button type="button" onclick="console.log(calculateFactorial(5))">Click me</button>
<script>
  function calculateFactorial(number){
    let sum =1;
    for(let i=1; i<=number; i++){
      sum *=i ;
    }
    return sum;
  }

</script>
</body>
