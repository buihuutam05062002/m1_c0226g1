<body>

<script>
    function reverseArr(arr){
        let result = [];
        for (let i = arr.length - 1; i >= 0; i--) {
            result.push(arr[i]);
        }
        return result;
    }
    console.log(reverseArr([4,1,6,8,1]));
</script>
</body>
