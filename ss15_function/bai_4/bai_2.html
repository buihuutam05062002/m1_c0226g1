<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<button type="button" onclick="console.log(calculateCircularArea(5))">Click Me</button>
<button type="button" onclick="console.log(calculatePerimeter(5))">Click Me</button>
<script>
    function calculateCircularArea(radius) {
        return Math.PI * (radius ** 2);
    }
    function calculatePerimeter(radius){
        return 2 * radius * Math.PI;
    }


</script>
</body>
</html>
