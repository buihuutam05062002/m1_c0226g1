<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>


<script>
  function footToMeter(foot){
    return 0.305 * foot;
  }
  function meterToFoot(meter){
    return 3.279 * meter;
  }

  document.writeln(footToMeter(5));
  document.writeln("<br>");
  document.writeln(meterToFoot(5));
</script>

</body>
</html>
