<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>


<script>
    let str = prompt("Nhập chuỗi:");
    let arr = str.trim().split(" ");
    let count = 0;
    for (let i = 0; i < arr.length; i++) {
        if (arr[i] !== "") {
            count++;
        }
    }
    console.log("Số từ trong chuỗi là: " + count);
</script>
</body>
</html>
