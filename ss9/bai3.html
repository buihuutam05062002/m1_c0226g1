<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div>
    <label for="squareSide">hình vuông cạnh a</label>
    <input type="text" id="squareSide">
</div>
<button type="button" onclick="calculateSquareArea()">Nhấn</button>
<h1 id="result"></h1>


<script>
    function calculateSquareArea() {
        let result = document.getElementById("result");
        let squareSide = parseFloat(document.getElementById("squareSide").value);
        result.innerText = (Math.pow(squareSide, 2)) + " là diện tích hình vuông";
    }
</script>
</body>

</html>
