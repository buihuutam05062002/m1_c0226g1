<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div>
    <label for="numberA">A: </label>
    <input type="number" id="numberA">
</div>
<div>
    <label for="numberB">B: </label>
    <input type="number" id="numberB">
</div>
<div>
    <label for="numberC">C: </label>
    <input type="number" id="numberC">
</div>
<button type="button" onclick="calculateQuadraticEquation()">Nhấn</button>
<h1 id="result"></h1>


<script>
    function calculateQuadraticEquation() {
        let result = document.getElementById("result");
        let numberA = parseFloat(document.getElementById("numberA").value);
        let numberB = parseFloat(document.getElementById("numberB").value);
        let numberC = parseFloat(document.getElementById("numberC").value);

        let delta = Math.pow(numberB, 2) - (4 * numberA * numberC);

        if (delta > 0) {
            let numberX1 = (-numberB + Math.sqrt(delta)) / (2 * numberA);
            let numberX2 = (-numberB - Math.sqrt(delta)) / (2 * numberA);
            result.innerText = "Nghiệm số 1: " + numberX1 + " Nghiệm số 2: " + numberX2;
        } else if (delta === 0) {
            let numberX = -1 * (numberB / (2 * numberA));
            result.innerText = "Nghiệm kép: " + numberX;

        } else {
            result.innerText = "Phương trình vô nghiệm ";
        }


    }
</script>
</body>

</html>
