<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div>
    <label for="sideA">hình tam giác vuông cạnh a</label>
    <input type="text" id="sideA">
</div>
<div>
    <label for="sideB">hình tam giác vuông cạnh b</label>
    <input type="text" id="sideB">
</div>
<button type="button" onclick="calculateRightTriangle()">Nhấn</button>
<h1 id="result"></h1>


<script>
    function calculateRightTriangle() {
        let sideA = parseFloat(document.getElementById("sideA").value);
        let sideB = parseFloat(document.getElementById("sideB").value);
        let result = document.getElementById("result");
        result.innerText = ((sideA * sideB) / 2) + " là diện tích tam giác vuông";
    }
</script>
</body>
</html>
