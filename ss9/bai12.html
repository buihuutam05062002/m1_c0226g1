<script>
    // lãi đơn




    let futureValue;
    let presentValue = +prompt("nhập số tieenf bạn muốn gửi lãi xuất kép");
    let compoundingMonthly = +prompt("Số tháng muốn gư tiếng kiệm");
    let interestRateMonthly = +prompt("Số phần trăm của lãi suất hàng tháng");

    alert(futureValue);
