<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div>
    <label for="meter">Chuyển từ met sang feet</label>
    <input type="text" id="meter">
</div>
<button type="button" onclick="calculateFeet()">Nhấn</button>
<h1 id="result"></h1>


<script>
    function calculateFeet() {
        let result = document.getElementById("result");
        let meter = parseFloat(document.getElementById("meter").value);
        result.innerText = (meter * 3.2808) + " feet";
</script>
}
</body>
</html>
