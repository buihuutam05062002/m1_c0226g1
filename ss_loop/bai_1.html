<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<style>
  tr, td{
    border: 2px solid black;
    gap : 10px;
    padding: 5px;
  }
</style>
<body>
<table id="_table" >
</table>
<script>
  let _table = document.getElementById("_table");
  for(let i = 1; i < 10; i++){
    let tr = document.createElement("tr");
    _table.appendChild(tr);
    for(let j = 2; j < 10; j++){
      let td = document.createElement("td");
      td.innerText =`${j} X ${i}  = ${i*j}`;
      tr.appendChild(td);
    }
  }
</script>
</body>
</html>
