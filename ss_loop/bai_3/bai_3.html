<script>
    function checkFibonacci(number) {
        if (number === 1 || number === 2) {
            return 1;
        } else if (number <= 0) {
            return 0;
        }
        return checkFibonacci(number - 1) + checkFibonacci(number - 2);

    }

    let count = 0;
    let numberCount = 0;
    while (true) {
        if (count > 20) {
            break;
        } else {
            console.log(checkFibonacci(numberCount));
            count++;
        }
        numberCount++
    }

</script>
