<!DOCTYPE html>

    <meta charset="UTF-8">
    <title>Title</title>

<body>


<script>
    function checkFibonacci(number) {
        if (number === 1 || number === 2) {
            return 1;
        } else if (number <= 0) {
            return 0;
        }
        return checkFibonacci(number - 1) + checkFibonacci(number - 2);

    }

    let count = 0;
    let numberCount = 1;
    while (count < 20) {
        let numberX = checkFibonacci(numberCount);
        if (numberX % 5 === 0) {
            console.log(numberX);
            break;
        } else {
            count++;
        }
        numberCount++;
    }


</script>
</body>
</html>
