<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>


<script>

    let count = 0;
    let number = 0;
    let sum = 0;
    while (true) {
        if (count > 30) {
            break;
        } else {
            if (number % 7 === 0) {
                sum += number;
                count++;
            }
        }
        number++;
    }
    alert(sum);

</script>
</body>
</html>
