<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div>
    <label for="numberA">a </label>
    <input type="number" id="numberA" name="numberA">
</div>

<button type="button" onclick="checkSign()">Check</button>
<h1 id="result"></h1>
</body>
<script>
    function checkSign() {
        let numberA = parseFloat(document.getElementById('numberA').value);
        let result = document.getElementById('result');
        if (numberA > 0) {
            result.innerText = numberA + " lớn hơn 0 ";
        } else if (numberA === 0) {
            result.innerText = numberA + " ===  0 ";
        } else {
            result.innerText = numberA + " nhỏ hơn  0 ";
        }
    }
</script>
</html>
