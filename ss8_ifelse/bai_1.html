<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

  <h2>Tính chỉ số cân nặng</h2>
  <label for="weight">Nhập cân nặng: (kg)</label>
  <input type="number" id="weight">
  <br>
  <br>
  <label for="height">Nhập chiều cao: (m)</label>
  <input type="text" id="height">
  <br>
  <br>
  <button type="button" onclick="calculate()">Kiểm tra</button>

  <h3 id="result"></h3>
</body>

<script>



function calculate(){
  let weight = parseFloat(document.getElementById("weight").value);
  let height = parseFloat(document.getElementById("height").value);

  let BMI = calculateBMI(weight, height);

  let result = document.getElementById("result");

  let text = "Chỉ số BMI là " + BMI+ ", ";

  if(BMI<18.5){
    result.innerText =text +  "Underweight";
  }
  else if (BMI < 25) {
    result.innerText =  text + "Normal";
  }
  else if (BMI < 30){
    result.innerText =  text + "Overweight";
  }
  else if (BMI >= 30){
    result.innerText =  text + "Overweight";
  }


}

function calculateBMI(weight, height){
  let result = weight / (height**2);
  return result;

}

</script>
</html>
