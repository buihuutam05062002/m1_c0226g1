<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div>
    <label for="timeCall"> thời gian gọi</label>
    <input type="text" id="timeCall">
</div>
<button type="button" onclick="taxCall()">Nhấn</button>
<h1 id="result"></h1>

</body>

<script type="text/javascript">
    let subscriber_account = 25000;
    let result = document.getElementById('result');
    function taxCall(){
        let timeCall = parseFloat(document.getElementById("timeCall").value);
        let temp ;
        if(timeCall <= 50){
            temp = timeCall * 600;
        }
        else if(timeCall > 200){
            temp = (50 * 600) + ((150) * 400) + ((timeCall-200) * 200);
        }
        else{
            temp = (50 * 600) + ((timeCall- 50) * 400);
        }
        temp += subscriber_account ;
        result.innerText = temp;
    }
</script>
</html>
