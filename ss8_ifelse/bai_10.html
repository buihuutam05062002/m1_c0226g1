<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div>
    <label for="timeCall"> thời gian gọi</label>
    <input type="text" id="timeCall">
</div>
<button type="button" onclick="calculateCallFee()">Nhấn</button>
<h1 id="result"></h1>

</body>

<script type="text/javascript">
    let baseFee = 25000;
    let result = document.getElementById('result');

    function calculateCallFee() {
        let callMinutes = parseFloat(document.getElementById("callMinutes").value);
        let callCost;
        if (callMinutes <= 50) {
            callCost = callMinutes * 600;
        } else if (callMinutes > 200) {
            callCost = (50 * 600) + ((150) * 400) + ((callMinutes - 200) * 200);
        } else {
            callCost = (50 * 600) + ((callMinutes - 50) * 400);
        }
        callCost += baseFee;
        result.innerText = callCost;
    }
</script>
</html>
