<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
  <div>
    <label for="age">Nhập tuổi</label>
    <input type = "number" id = "age">
  </div>
<button type="button" onclick="isAge()">Check</button>
<h1 id="result"></h1>
</body>
<script>
  function isAge(){
    age = parseInt(document.getElementById('age').value);
    result = document.getElementById('result');
    if(age <15){
      result.innerText = "Không đủ tuổi vào lớp 10";
    }
    else{
      result.innerText = "Đủ tuổi vào lớp 10";
    }
  }
</script>
</html>
