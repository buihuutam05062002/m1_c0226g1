<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>
<div>
  <label for="numberA">Điểm kiểm tra: </label>
  <input type="number" name="number_a" id="numberA">
</div>
<div>
  <label for="numberB">Điểm giữa kì: </label>
  <input type="number" name="" id="numberB">
</div>
<div>
  <label for="numberC">Điểm cuối kì: </label>
  <input type="number" name="" id="numberC">
</div>
<div>
  <button type="button" onclick="check_Maxnumber()">Check
    Submit
  </button>
</div>
<h1 id="result">

</h1>

</body>
<script>
  function check_Maxnumber(){
    let numberA = parseFloat(document.getElementById("numberA").value);
    let numberB = parseFloat(document.getElementById("numberB").value);
    let numberC = parseFloat(document.getElementById("numberC").value);
    let result = document.getElementById("result");
    let temp ;
    temp = (numberA + numberB + numberC) / 3 ;
    if((numberA <=10 && numberA >=0) && (numberB <=10 && numberB>=0)  && (numberC <=10 && numberC>=0)){
      if (temp >= 9 ) {
        result.innerText = "A";
      }
      else if (temp >=7){
        result.innerText = "B";
      }
      else if (temp >= 5){
        result.innerText = "C";
      }
      else{
        result.innerText = "F";
      }
    }
    else{
      result.innerText = "Người dùng nhập lệu sai";
    }

  }
</script>
</html>
